<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <g transform="rotate(45 24 24)">
    <!-- Plate 1: Aubergine base with rim -->
    <circle cx="18" cy="24" r="14" fill="#2A1455" />
    <circle cx="18" cy="24" r="10" stroke="#FFF3E4" stroke-width="2" opacity="0.4" />
    <!-- Plate 2: Chili accent with rim, overlapping -->
    <circle cx="30" cy="24" r="14" fill="#FF5A3C" fill-opacity="0.92" />
    <circle cx="30" cy="24" r="10" stroke="#FFF3E4" stroke-width="2" opacity="0.6" />
    <!-- Overlap intersection spark/accent -->
    <circle cx="24" cy="24" r="3.5" fill="#FF9F1C" />
  </g>
</svg>